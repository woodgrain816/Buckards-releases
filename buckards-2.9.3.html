<script>
"use strict";
/* BUCKARDS - get the Buckos out of the store. Correctly.
   Every Bucko comes in for one thing from one aisle. He has to find it, pay for
   it, and leave by the right door - and once he's paid he doesn't go back in.
   Done-shopping Buckos get impatient and try to sneak out without paying.
   Every mistake is a fine; every second mistake is also a strike; six strikes
   and the Bucko Bombers show up with something bigger each time, from an
   A-10's cannon to a B-52's nuclear bomb.

   One canvas. The world is 1600x900 units; the camera follows you zoomed in on
   small screens. The store's floor, shelves and walls are painted once into an
   offscreen layer; people, signs and effects are drawn on top every frame.
   The Android build and the PC launcher read GR_VERSION / GR_MIN_NATIVE /
   GR_NOTES out of this file. */

const GR_VERSION = "2.9.3";
const GR_MIN_NATIVE = 1;
const GR_NOTES = "New Stick sensitivity setting (Settings > Controls): a small push of the joystick can now give full speed. Default is more sensitive than before.";
const DISCLAIMER = 'Buckards is a parody game. Not affiliated with or endorsed by any real store.';
const UPDATE_URL = "https://raw.githubusercontent.com/woodgrain816/Buckards-releases/main/update.json";

const W = 1600, H = 900;
const MOBILE = /mobile/.test(location.hash) || /mobile/.test(location.search);
const APP = window.GR || null;                   // the Android wrapper's bridge, when there is one
const FD = '"Arial Black", "Roboto", Arial, sans-serif';   // display
const FB = 'Arial, "Roboto", sans-serif';                  // body
const FM = '"Courier New", Courier, monospace';            // receipts
const FN = '"Times New Roman", Georgia, serif';            // newspaper
const cv = document.getElementById('c');
let g = cv.getContext('2d');
/* graphics: 'auto' (drops to low by itself if frames run slow), 'high' or 'low' */
let gfxMode = (() => { try { return JSON.parse(localStorage.getItem('grenards_gfx')) || 'auto'; } catch (e) { return 'auto'; } })(), autoLow = false;
const lowFX = () => gfxMode === 'low' || (gfxMode === 'auto' && autoLow);
let cw, ch, dpr, sc, ox, oy, hs, hx, hudH, hudCut = 0, scFit, ov, vignette = null, compactHUD = false, ROT = false;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, lowFX() ? 1 : 1.75);
  // A tall touch screen (a tablet held upright, or one that won't rotate for us) gets the game drawn turned 90 degrees,
  // so it always plays sideways. cw/ch are the game's own (sideways) width and height either way.
  ROT = (MOBILE || matchMedia('(pointer:coarse)').matches) && innerHeight > innerWidth * 1.05;
  cw = ROT ? innerHeight : innerWidth; ch = ROT ? innerWidth : innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.transformOrigin = '0 0'; cv.style.transform = ROT ? `translateX(${ch}px) rotate(90deg)` : '';
  sc = ch > cw ? Math.min(cw / 860, ch / H) : Math.min(cw / W, ch / H); ox = (cw - W * sc) / 2; oy = (ch - H * sc) / 2;   // title: whole 1600x900, or zoomed on the menu column when the screen stands up
  hudCut = cw < 1150 ? 216 : 0;                                                   // narrow screens: no logo, bigger HUD
  hs = Math.min(cw / (W - hudCut), 1); hx = (cw - (W - hudCut) * hs) / 2 - hudCut * hs; hudH = 60 * hs;
  compactHUD = cw < 1150 && (MOBILE || matchMedia('(pointer:coarse)').matches);   // phones: five big readouts instead of nine small ones
  if (compactHUD) { hs = Math.min(cw / 1000, 1); hx = (cw - 1000 * hs) / 2; hudH = 60 * hs; }
  scFit = Math.min(cw / W, (ch - hudH) / (H - 60));                                // whole floor
  ov = Math.min(cw / 1000, ch / 790, 1.25);                                        // menus: content spans y 100..880
  vignette = null;
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const money = v => (v < 0 ? '-$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');
const money2 = v => '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const newer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('grenards_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('grenards_' + k, JSON.stringify(v)); } catch (e) {} }
};
const touchy = () => MOBILE || matchMedia('(pointer:coarse)').matches;
const SET = Object.assign({ zoom: 1, vol: 2, mvol: 2, map: (MOBILE || matchMedia('(pointer:coarse)').matches) ? 'hidden' : 'show', mapSize: 1, names: 'near', fps: false, joySide: 'right', joySize: 1, vib: true, hints: true }, store.get('settings', {}));
const saveSet = () => store.set('settings', SET);
const VOLS = [0.35, 0.7, 1];
const buzz = ms => { try { if (SET.vib && touchy() && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

/* On a phone the whole floor would make a Bucko ~7px across, so the camera
   follows you zoomed in; it pulls back to the whole store for an airstrike. */
const MIN_SCALE = 0.8;
const cam = { x: W / 2, y: H / 2, s: 0, tx: 0, ty: 0 };
const isAir = () => G.state === 'airstrike' || G.state === 'gameover' || G.state === 'aftermath';
function updateCam(dt) {
  const want = isAir() ? scFit : Math.max(scFit, touchy() ? Math.max([0.85, 1.05, 1.3][SET.zoom], ch > cw ? (ch - hudH) / (H - 60) : 0) : MIN_SCALE);
  cam.s = cam.s ? cam.s + (want - cam.s) * Math.min(1, dt * 3) : want;
  const vw = cw / cam.s, vh = (ch - hudH) / cam.s, p = G.player;
  const wx = vw >= W ? W / 2 : clamp(p.x, vw / 2, W - vw / 2), wy = vh >= H - 60 ? 60 + (H - 60) / 2 : clamp(p.y, 60 + vh / 2, H - vh / 2);
  const k = Math.min(1, dt * 6); cam.x += (wx - cam.x) * k; cam.y += (wy - cam.y) * k;
  if (vw >= W) cam.x = W / 2; if (vh >= H - 60) cam.y = wy;
  cam.tx = cw / 2 - cam.x * cam.s; cam.ty = hudH + (ch - hudH) / 2 - cam.y * cam.s;
}

/* ------------------------------------------------------------ the store */
const SHELVES = [];
for (let i = 0; i < 8; i++) SHELVES.push({ x: 190 + i * 160, y: 150, w: 44, h: 400 });
const RACKS = [{ x: 1400, y: 300, w: 150, h: 26 }, { x: 1400, y: 430, w: 150, h: 26 }];
const DECOR = [

  { x: 48, y: 420, w: 96, h: 50, kind: 'gnomes' }, { x: 40, y: 600, w: 66, h: 40, kind: 'hotdog' },
  { x: 1440, y: 520, w: 80, h: 44, kind: 'forklift' }
];
const LANES = [600, 850, 1100];
const LANE_W = 70, CTR_Y = 700, CTR_H = 40;
const COUNTERS = [];
{ let x0 = 330; for (const c of LANES) { COUNTERS.push({ x: x0, y: CTR_Y, w: c - LANE_W / 2 - x0, h: CTR_H }); x0 = c + LANE_W / 2; }
  COUNTERS.push({ x: x0, y: CTR_Y, w: 1570 - x0, h: CTR_H }); }
const SOLIDS = [...SHELVES, ...RACKS, ...DECOR, ...COUNTERS];
const ENTRANCE = { x: 110, w: 160 }, EXIT = { x: 1330, w: 160 };
const ZONE_Y = 790;                       // a Bucko past this at a door is out
const GATE = { y: 95, h: 115 };           // lumber yard gate in the right wall
const BACK_IN_Y = 612;                    // a paid Bucko held north of this for BACK_IN_T s has been taken back into the store
const BACK_IN_T = 7;

/* where each thing lives: the aisle between shelf i and i+1, plus the two side areas */
const AISLES = ['PAINT', 'PLUMBING', 'ELECTRICAL', 'TOOLS', 'HARDWARE', 'GARDEN', 'BIRDSEED'];
const AREAS = {};
AISLES.forEach((a, i) => AREAS[a] = { x: 234 + i * 160, y: 160, w: 116, h: 390, cx: 292 + i * 160 });
AREAS.SEASONAL = { x: 30, y: 160, w: 160, h: 390, cx: 110 };
AREAS.LUMBER = { x: 1360, y: 230, w: 210, h: 330, cx: 1475 };
const inArea = (o, a) => o.x > a.x && o.x < a.x + a.w && o.y > a.y && o.y < a.y + a.h;

const ITEMS = [
  ['gallon of paint', 34.98, 'PAINT', 'can'], ['paint roller kit', 12.97, 'PAINT', 'box'],
  ['toilet flange', 7.48, 'PLUMBING', 'box'], ['10ft PVC pipe', 6.12, 'PLUMBING', 'pipe'], ['shop sink', 89.0, 'PLUMBING', 'box'],
  ['extension cord', 15.99, 'ELECTRICAL', 'box'], ['ceiling fan', 119.0, 'ELECTRICAL', 'box'],
  ['shop vac', 89.99, 'TOOLS', 'box'], ['cordless drill', 129.0, 'TOOLS', 'box'],
  ['box of screws', 9.97, 'HARDWARE', 'box'], ['novelty mailbox', 39.99, 'HARDWARE', 'box'],
  ['bag of mulch', 3.33, 'GARDEN', 'bag'], ['garden gnome', 24.99, 'GARDEN', 'gnome'],
  ['bag of birdseed', 18.49, 'BIRDSEED', 'bag'], ['bag of deer corn', 11.99, 'BIRDSEED', 'bag'], ['6-pack of Snickers', 6.49, 'BIRDSEED', 'box'],
  ['pellet grill', 449.0, 'SEASONAL', 'box'], ['deer feeder', 64.99, 'SEASONAL', 'box']
];

const MAX_STRIKES = 6;
/* every time strikes reach MAX_STRIKES, the next rung. The money is the fine; the nuke takes the total score. */
const LADDER = [
  { ac: 'A-10', w: 'GAU-8 cannon', fx: 'gun', fine: 400 },
  { ac: 'A-10', w: 'AGM-65 Maverick', fx: 'missile', n: 1, big: 1, fine: 700 },
  { ac: 'F-15', w: 'GBU-12 Paveway', fx: 'bomb', n: 2, big: 1, fine: 1000 },
  { ac: 'F-15', w: 'GBU-31 JDAM', fx: 'bomb', n: 4, big: 1.1, fine: 1500 },
  { ac: 'F-16', w: 'Mk-84 bombs', fx: 'bomb', n: 4, big: 1.35, fine: 2000 },
  { ac: 'F-16', w: 'CBU-97 cluster bomb', fx: 'cluster', n: 45, big: 1, fine: 2800 },
  { ac: 'F/A-18', w: 'AGM-84 SLAM-ER', fx: 'missile', n: 3, big: 1.5, fine: 3800 },
  { ac: 'F/A-18', w: 'GBU-32 x6', fx: 'bomb', n: 6, big: 1.4, fine: 5000 },
  { ac: 'B-1', w: 'Mk-82 carpet (24)', fx: 'carpet', n: 24, big: 1, fine: 7000 },
  { ac: 'B-1', w: 'AGM-158 JASSM', fx: 'missile', n: 5, big: 1.9, fine: 9500 },
  { ac: 'B-21', w: 'GBU-57 bunker buster', fx: 'mop', n: 1, big: 1, fine: 13000 },
  { ac: 'B-52', w: 'Mk-117 carpet bombing', fx: 'carpet', n: 42, big: 1.4, fine: 18000 },
  { ac: 'B-52', w: 'B61 NUCLEAR BOMB', fx: 'nuke', n: 1, big: 1, fine: 0 }
];

// seeded products so the shelves look stocked and never flicker
const PRODUCTS = (() => {
  let s = 12345; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = ['#c0392b', '#e67e22', '#f1c40f', '#2e86de', '#8e44ad', '#16a085', '#ecf0f1', '#7f8c8d', '#d35400', '#27ae60', '#34495e'];
  return SHELVES.map(sh => { const a = [];
    for (let y = sh.y + 6; y < sh.y + sh.h - 10; y += 13) for (const side of [0, 1]) {
      if (r() < 0.12) continue;
      const kind = r() < 0.35 ? 'can' : r() < 0.6 ? 'bag' : 'box';
      a.push({ x: sh.x + 3 + side * 21, y, w: 18, h: 10, c: cols[(r() * cols.length) | 0], kind });
    } return a; });
})();

function pushOut(o, r) {
  for (const s of SOLIDS) {
    const cx = clamp(o.x, s.x, s.x + s.w), cy = clamp(o.y, s.y, s.y + s.h);
    const dx = o.x - cx, dy = o.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= r * r) continue;
    if (d2 < 1e-6) {
      const l = o.x - s.x, r2 = s.x + s.w - o.x, t = o.y - s.y, b = s.y + s.h - o.y, m = Math.min(l, r2, t, b);
      if (m === l) o.x = s.x - r; else if (m === r2) o.x = s.x + s.w + r; else if (m === t) o.y = s.y - r; else o.y = s.y + s.h + r;
    } else { const d = Math.sqrt(d2); o.x = cx + dx / d * r; o.y = cy + dy / d * r; }
  }
  o.x = clamp(o.x, 30 + r, 1570 - r); o.y = clamp(o.y, 80 + r, 870 - r);
}
const blocked = p => SOLIDS.some(s => p.x > s.x - 24 && p.x < s.x + s.w + 24 && p.y > s.y - 24 && p.y < s.y + s.h + 24);
function freeSpot(area) {
  for (let k = 0; k < 60; k++) {
    const p = area ? { x: rnd(area.x + 10, area.x + area.w - 10), y: rnd(area.y + 10, area.y + area.h - 10) } : { x: rnd(60, 1540), y: rnd(110, 670) };
    if (!blocked(p)) return p;
  }
  return area ? { x: area.cx, y: area.y + area.h / 2 } : { x: 110, y: 620 };
}

/* ------------------------------------------------------------ sound
   Synth only, no files. Off by default on the PC, on in the phone build. */
const S = {
  on: store.get('sound', true), ac: null, master: null,
  ensure() {
    if (!this.on) return null;
    if (!this.ac) {
      try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      this.master = this.ac.createGain(); this.master.gain.value = 0.9 * VOLS[SET.vol]; this.master.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, d, type = 'square', vol = 0.12, f2 = null, delay = 0) {
    const a = this.ensure(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), v = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(v).connect(this.master); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, vol = 0.3, freq = 800, delay = 0, q = 0.8) {
    const a = this.ensure(); if (!a) return;
    const t = a.currentTime + delay, n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), c0 = buf.getChannelData(0);
    for (let i = 0; i < n; i++) c0[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; v.gain.value = vol;
    src.connect(f).connect(v).connect(this.master); src.start(t);
  },
  brrt(d, delay) {          // GAU-8: ~65 rounds a second, so a 65 Hz buzz with grit on top
    const a = this.ensure(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), am = a.createOscillator(), amg = a.createGain(), v = a.createGain(), f = a.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 130; am.type = 'square'; am.frequency.value = 65; amg.gain.value = 0.5;
    f.type = 'lowpass'; f.frequency.value = 900;
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
    v.gain.setValueAtTime(0.35, t + d - 0.2); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    am.connect(amg).connect(v.gain); o.connect(f).connect(v).connect(this.master);
    o.start(t); am.start(t); o.stop(t + d); am.stop(t + d);
    this.noise(d, 0.25, 300, delay, 0.5);
  },
  jet(delay, heavy) { this.noise(2.6, heavy ? 0.28 : 0.18, heavy ? 600 : 1800, delay, 0.3); this.tone(heavy ? 300 : 900, 2.4, 'sawtooth', 0.03, heavy ? 120 : 300, delay); },
  whoosh(delay) { this.noise(0.5, 0.15, 2500, delay, 0.6); },
  whistleDown(delay, d = 0.7) { this.tone(1800, d, 'sine', 0.05, 400, delay); },
  scan() { this.tone(1760, 0.08, 'square', 0.07); },
  join() { this.tone(520, 0.08, 'triangle', 0.14, 780); },
  found() { this.tone(660, 0.07, 'triangle', 0.12); this.tone(990, 0.12, 'triangle', 0.12, null, 0.07); },
  out() { this.tone(660, 0.1, 'triangle', 0.14); this.tone(880, 0.1, 'triangle', 0.14, null, 0.08); this.tone(1320, 0.16, 'triangle', 0.12, null, 0.16); },
  coin() { this.tone(1400, 0.06, 'square', 0.06); this.tone(2100, 0.1, 'square', 0.06, null, 0.06); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.14, null, i * 0.11)); },
  jackpot() { for (let i = 0; i < 12; i++) this.tone(800 + i * 120, 0.12, 'square', 0.07, null, i * 0.06); this.fanfare(); },
  bad() { this.tone(160, 0.45, 'sawtooth', 0.18, 90); },
  nope() { this.tone(220, 0.12, 'square', 0.08, 180); },
  chime() { this.tone(659, 0.5, 'sine', 0.12); this.tone(523, 0.7, 'sine', 0.12, null, 0.35); },
  copWhistle() { this.tone(2900, 0.18, 'square', 0.06); this.tone(2900, 0.35, 'square', 0.06, null, 0.25); },
  whistle() { this.tone(2200, 0.35, 'sine', 0.1, 2600); this.tone(2600, 0.3, 'sine', 0.08, 2300, 0.3); },
  boom(delay = 0, k = 1) { this.noise(0.9 * k, Math.min(0.8, 0.5 * k), 120, delay, 0.4); this.tone(90, 0.7 * k, 'sine', Math.min(0.6, 0.35 * k), 30, delay); },
  siren() { for (let i = 0; i < 4; i++) this.tone(600, 0.45, 'sawtooth', 0.07, 1100, i * 0.5); },
  buzzer() { this.tone(110, 0.9, 'square', 0.12); }
};

/* store muzak: soft jazz chords, a walking bass and a few vibraphone notes,
   scheduled a little ahead of time. It speeds up as closing time gets near. */
const M = {
  on: store.get('music', true), timer: null, next: 0, step: 0, gain: null,
  start() {
    if (this.timer || !S.on || !this.on) return;
    const a = S.ensure(); if (!a) return;
    this.gain = a.createGain(); this.gain.gain.value = 0.0001; this.gain.connect(S.master);
    this.gain.gain.exponentialRampToValueAtTime(0.16 * VOLS[SET.mvol], a.currentTime + 1.5);
    this.next = a.currentTime + 0.1; this.step = 0;
    this.timer = setInterval(() => this.tick(), 90);
  },
  stop() {
    if (!this.timer) return; clearInterval(this.timer); this.timer = null;
    const a = S.ac, gn = this.gain; if (a && gn) { gn.gain.setTargetAtTime(0.0001, a.currentTime, 0.2); setTimeout(() => gn.disconnect(), 1500); }
  },
  tick() {
    const a = S.ac; if (!a) return;
    const tense = G.state === 'play' && (G.timer < 20 || G.strikes >= MAX_STRIKES - 1);
    const bpm = tense ? 132 : 96, eighth = 60 / bpm / 2;
    while (this.next < a.currentTime + 0.35) { this.play(this.step, this.next, eighth); this.next += eighth; this.step++; }
  },
  play(step, t, e) {
    const a = S.ac, CH = [[60, 64, 67, 71], [57, 60, 64, 67], [62, 65, 69, 72], [55, 59, 62, 65]];   // Cmaj7 Am7 Dm7 G7
    const bar = Math.floor(step / 8) % 4, s = step % 8, c = CH[bar], hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const note = (m, d, type, vol) => {
      const o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.value = hz(m);
      v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.02); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(v).connect(this.gain); o.start(t); o.stop(t + d + 0.05);
    };
    if (s === 0) c.forEach(m => note(m, e * 7.5, 'triangle', 0.18));
    if (s === 0 || s === 3 || s === 4 || s === 6) note(c[0] - 24 + (s === 4 ? 7 : s === 6 ? 4 : 0), e * 1.6, 'sine', 0.55);
    if ((s === 2 || s === 5 || s === 7) && Math.random() < 0.55) note(pick([72, 74, 76, 79, 81, 84]), e * 3, 'sine', 0.22);
  }
};

/* ------------------------------------------------------------ people */
const NAMES = ['Dale', 'Big Rick', 'Gary', 'Duane', 'Randy', 'Chuck', 'Lyle', 'Darrell', 'Kevin', 'Merle', 'Dwight', 'Earl',
  'Butch', 'Clint', 'Leroy', 'Vern', 'Dusty', 'Wade', 'Hank', 'Bucky', 'Lonnie', 'Roger', 'Terry', 'Marv', 'Skip', 'Denny',

const FLANNEL = ['#b03a2e', '#1f618d', '#7d6608', '#196f3d', '#6c3483', '#a04000', '#2c3e50', '#922b21'];
const SKIN = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac', '#f3c9a0'];

function exportSave() {
  const data = {}; try { for (const k of Object.keys(localStorage)) if (k.startsWith('grenards_')) data[k] = localStorage.getItem(k); } catch (e) {}
  const bytes = new TextEncoder().encode(JSON.stringify(data)); let bin = ''; for (const x of bytes) bin += String.fromCharCode(x);

function importSave() {
  const code = (prompt('Paste your Buckards save code here.\nThis REPLACES the progress on this device.') || '').trim();
  if (!code) return;
  try {
    if (!code.startsWith('BUCKARDS1:')) throw 0;
    const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(code.slice(10)), ch => ch.charCodeAt(0))));   // (not escape(): that name is the runaway-Bucko function)
    for (const k of Object.keys(localStorage)) if (k.startsWith('grenards_')) localStorage.removeItem(k);
    for (const [k, v] of Object.entries(data)) if (k.startsWith('grenards_')) localStorage.setItem(k, v);
    location.reload();
  } catch (e) { alert("That doesn't look like a Buckards save code. Copy the whole thing and try again."); }
}

/* the next morning's paper. kind: 'aftermath' (store reopens) or 'nuke' (game over) */

/* ------------------------------------------------------------ frame */
let last = performance.now(), lastState = 'title', fadeT = 0;

  const raw = (now - last) / 1000;
  if (gfxMode === 'auto' && !autoLow && G.state === 'play' && !document.hidden) {
    perf.n++; perf.sum += raw; perf.t += raw;
    if (perf.t > 3) { if (perf.sum / perf.n > 1 / 40) { autoLow = true; staticLayer = null; resize(); } perf.n = perf.sum = perf.t = 0; }

  const menuLayer = () => g.setTransform(dpr * ov, 0, 0, dpr * ov, dpr * (cw / 2 - 800 * ov), dpr * (ch / 2 - 490 * ov));
  if (G.state === 'title') {
    g.fillStyle = '#3c3f43'; g.fillRect(0, 0, cw, ch);

  } else {

    g.drawImage(staticLayer, 0, 0, W, H);
    if (G.decals.length && decalCv) g.drawImage(decalCv, 0, 0, W, H);
    drawEvents();
    drawForks();
    drawArrow();
    const people = [...G.buckos, G.player, ...CASHIERS, ...G.cops];
    if (G.pet && META.eq.pet) people.push(G.pet);
    if (G.strikes >= MAX_STRIKES - 2 && !isAir()) people.push(...AGENTS);
    people.sort((a, b) => a.y - b.y);

      if (e === G.player) { if (!(G.as && G.as.hitPlayer && !e.rag)) drawPerson(e, playerLook(), { r: 19 }); }
      else if (e.isPet) drawPet(META.eq.pet, e.x, e.y, e.dir, e.walk, Math.hypot(e.vx, e.vy) > 5);
      else if (e.isCashier) drawCashier(e);
      else if (e.isAgent) { e.dir = G.player.x > e.x ? 1 : -1; drawPerson(e, AGENT_LOOK); }

      g.beginPath(); g.moveTo(p.x - 8, y - 8); g.lineTo(p.x + 8, y - 8); g.lineTo(p.x, y + 2); g.closePath(); g.fill(); g.stroke();
      text('YOU', p.x, y - 18, 11, '#ffe14d', 'center', '900', '#06331a');
      const ti = META.eq.title && shopItem(META.eq.title); if (ti) text(ti.name, p.x, y - 34, 13, ti.color, 'center', '900', '#06331a');
    }
    if (G.mod === 'brownout' && (G.state === 'play' || G.state === 'pause')) {
      const p = G.player, k = clamp((G.dayLen - G.timer) / 3, 0, 1) * 0.68, gr = g.createRadialGradient(p.x, p.y, 80, p.x, p.y, 330);
      gr.addColorStop(0, 'rgba(4,6,18,0)'); gr.addColorStop(1, `rgba(4,6,18,${k})`); g.fillStyle = gr; g.fillRect(0, 0, W, H);

    if (air && G.as.t < RUN_START + 0.4) { g.fillStyle = `rgba(200,0,0,${0.25 * clamp(G.as.t * 2, 0, 1)})`; g.fillRect(0, 0, cw, ch); }

    if (G.flash) { g.fillStyle = `rgba(255,248,230,${Math.min(1, G.flash * 0.7)})`; g.fillRect(0, 0, cw, ch); }
    g.setTransform(dpr * hs, 0, 0, dpr * hs, dpr * hx, 0);
    g.fillStyle = '#076b2f'; g.fillRect(-hx / hs - 10, 0, cw / hs + 20, 60);

    if (G.state === 'gameover' || G.state === 'aftermath') { g.fillStyle = `rgba(10,8,6,${0.82 * clamp((G.as.t - G.as.end) / 1.0, 0, 1)})`; g.fillRect(0, 0, cw, ch); }
    menuLayer();
    if (G.state === 'airstrike') drawAirstrikeText();
    if (G.state === 'intro') drawIntro();
    else if (G.state === 'summary') drawSummary();
    else if (G.state === 'shop') drawShop();
    else if (G.state === 'pause') drawPause();
    else if (G.state === 'aftermath') drawNewspaper('aftermath');
    else if (G.state === 'gameover') { drawNewspaper('nuke'); if (G.as.t > G.as.end + 2) drawUpdateBanner(800, 100); }

requestAnimationFrame(frame);

/* updates: the Android wrapper calls grUpdate when it has one; on the PC the

window.grUpdate = (state, version, notes) => { G.update = { state, version, notes }; };
const OFFLINE_FILE = /Buckards-Offline/i.test(decodeURIComponent(location.pathname));   // the copy-anywhere offline file
const ON_WEB = /github\.io$|netlify\.app$|vercel\.app$|web\.app$|firebaseapp\.com$/.test(location.host);        // the copy GitHub Pages serves (what the exe opens)
function freshLoad(v) { location.replace(location.pathname + '?v=' + encodeURIComponent(v) + location.hash); }
function checkUpdate() {
  if (APP) { try { APP.check(); } catch (e) {} return; }     // the Android wrapper downloads it and calls grUpdate
  if (!/^(file|https?):$/.test(location.protocol) || /localhost|127\.0\.0\.1/.test(location.host)) return;
  fetch(UPDATE_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(m => {
    if (!m || !newer(m.version, GR_VERSION)) return;
    if (ON_WEB && G.state === 'title') { freshLoad(m.version); return; }        // nothing to lose on the title screen: just update
    G.update = { state: ON_WEB ? 'web' : OFFLINE_FILE ? 'file' : 'pc', version: m.version, notes: m.notes };
  }).catch(() => {});
}
checkUpdate();
setInterval(checkUpdate, 4 * 60 * 1000);
let installEvt = null;                                       // Chrome's "install this app" offer, shown as a title button
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
addEventListener('appinstalled', () => { installEvt = null; });
if (ON_WEB && 'serviceWorker' in navigator) {               // saves the game so it runs with no internet
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
