"use strict";
/* BUCKARDS - get the Buckos out of the store. Correctly.
   Every Bucko comes in for one thing from one aisle. He has to find it, pay for
   it, and leave by the right door - and once he's paid he doesn't go back in.
   Done-shopping Buckos get impatient and try to sneak out without paying.
   Every mistake is a strike and a fine; every third strike the military shows
   up with something bigger, from an A-10's cannon to a B-52's nuclear bomb.

   One canvas. The world is 1600x900 units; the camera follows you zoomed in on
   small screens. The store's floor, shelves and walls are painted once into an
   offscreen layer; people, signs and effects are drawn on top every frame.
   The Android build and the PC launcher read GR_VERSION / GR_MIN_NATIVE /
   GR_NOTES out of this file. */

const GR_MIN_NATIVE = 1;
const GR_NOTES = "New title screen: lined-up store front, a proper parking lot with real cars, tidy text.";
const UPDATE_URL = "https://raw.githubusercontent.com/woodgrain816/Buckards-releases/main/update.json";

const W = 1600, H = 900;
const MOBILE = /mobile/.test(location.hash) || /mobile/.test(location.search);

let cw, ch, dpr, sc, ox, oy, hs, hx, hudH, hudCut = 0, scFit, ov, vignette = null;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cw = innerWidth; ch = innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  sc = Math.min(cw / W, ch / H); ox = (cw - W * sc) / 2; oy = (ch - H * sc) / 2;   // whole 1600x900 (title)
  hudCut = cw < 1150 ? 216 : 0;                                                   // narrow screens: no logo, bigger HUD
  hs = Math.min(cw / (W - hudCut), 1); hx = (cw - (W - hudCut) * hs) / 2 - hudCut * hs; hudH = 60 * hs;
  scFit = Math.min(cw / W, (ch - hudH) / (H - 60));                                // whole floor
  ov = Math.min(cw / 1000, ch / 790, 1.25);                                        // menus: content spans y 100..880

}

  for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };

/* On a phone the whole floor would make a Bucko ~7px across, so the camera
   follows you zoomed in; it pulls back to the whole store for an airstrike. */
const MIN_SCALE = 0.8;
const cam = { x: W / 2, y: H / 2, s: 0, tx: 0, ty: 0 };
const isAir = () => G.state === 'airstrike' || G.state === 'gameover' || G.state === 'aftermath';
function updateCam(dt) {
  const want = isAir() ? scFit : Math.max(scFit, MIN_SCALE);
  cam.s = cam.s ? cam.s + (want - cam.s) * Math.min(1, dt * 3) : want;
  const vw = cw / cam.s, vh = (ch - hudH) / cam.s, p = G.player;
  const wx = vw >= W ? W / 2 : clamp(p.x, vw / 2, W - vw / 2), wy = vh >= H - 60 ? 60 + (H - 60) / 2 : clamp(p.y, 60 + vh / 2, H - vh / 2);
  const k = Math.min(1, dt * 6); cam.x += (wx - cam.x) * k; cam.y += (wy - cam.y) * k;
  if (vw >= W) cam.x = W / 2; if (vh >= H - 60) cam.y = wy;
  cam.tx = cw / 2 - cam.x * cam.s; cam.ty = hudH + (ch - hudH) / 2 - cam.y * cam.s;
}

// seeded products so the shelves look stocked and never flicker
const PRODUCTS = (() => {
  let s = 12345; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = ['#c0392b', '#e67e22', '#f1c40f', '#2e86de', '#8e44ad', '#16a085', '#ecf0f1', '#7f8c8d', '#d35400', '#27ae60', '#34495e'];
  return SHELVES.map(sh => { const a = [];
    for (let y = sh.y + 6; y < sh.y + sh.h - 10; y += 13) for (const side of [0, 1]) {
      if (r() < 0.12) continue;
      const kind = r() < 0.35 ? 'can' : r() < 0.6 ? 'bag' : 'box';
      a.push({ x: sh.x + 3 + side * 21, y, w: 18, h: 10, c: cols[(r() * cols.length) | 0], kind });
    } return a; });
})();

function pushOut(o, r) {
  for (const s of SOLIDS) {
    const cx = clamp(o.x, s.x, s.x + s.w), cy = clamp(o.y, s.y, s.y + s.h);
    const dx = o.x - cx, dy = o.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= r * r) continue;
    if (d2 < 1e-6) {
      const l = o.x - s.x, r2 = s.x + s.w - o.x, t = o.y - s.y, b = s.y + s.h - o.y, m = Math.min(l, r2, t, b);
      if (m === l) o.x = s.x - r; else if (m === r2) o.x = s.x + s.w + r; else if (m === t) o.y = s.y - r; else o.y = s.y + s.h + r;
    } else { const d = Math.sqrt(d2); o.x = cx + dx / d * r; o.y = cy + dy / d * r; }
  }
  o.x = clamp(o.x, 30 + r, 1570 - r); o.y = clamp(o.y, 80 + r, 870 - r);
}
const blocked = p => SOLIDS.some(s => p.x > s.x - 24 && p.x < s.x + s.w + 24 && p.y > s.y - 24 && p.y < s.y + s.h + 24);
function freeSpot(area) {
  for (let k = 0; k < 60; k++) {
    const p = area ? { x: rnd(area.x + 10, area.x + area.w - 10), y: rnd(area.y + 10, area.y + area.h - 10) } : { x: rnd(60, 1540), y: rnd(110, 670) };
    if (!blocked(p)) return p;
  }
  return area ? { x: area.cx, y: area.y + area.h / 2 } : { x: 110, y: 620 };
}

/* ------------------------------------------------------------ sound
   Synth only, no files. Off by default on the PC, on in the phone build. */
const S = {
  on: store.get('sound', MOBILE), ac: null, master: null,
  ensure() {
    if (!this.on) return null;
    if (!this.ac) {
      try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      this.master = this.ac.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  tone(f, d, type = 'square', vol = 0.12, f2 = null, delay = 0) {
    const a = this.ensure(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), v = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(v).connect(this.master); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, vol = 0.3, freq = 800, delay = 0, q = 0.8) {
    const a = this.ensure(); if (!a) return;
    const t = a.currentTime + delay, n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), c0 = buf.getChannelData(0);
    for (let i = 0; i < n; i++) c0[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; v.gain.value = vol;
    src.connect(f).connect(v).connect(this.master); src.start(t);
  },
  brrt(d, delay) {          // GAU-8: ~65 rounds a second, so a 65 Hz buzz with grit on top
    const a = this.ensure(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), am = a.createOscillator(), amg = a.createGain(), v = a.createGain(), f = a.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 130; am.type = 'square'; am.frequency.value = 65; amg.gain.value = 0.5;
    f.type = 'lowpass'; f.frequency.value = 900;
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
    v.gain.setValueAtTime(0.35, t + d - 0.2); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    am.connect(amg).connect(v.gain); o.connect(f).connect(v).connect(this.master);
    o.start(t); am.start(t); o.stop(t + d); am.stop(t + d);
    this.noise(d, 0.25, 300, delay, 0.5);
  },
  jet(delay, heavy) { this.noise(2.6, heavy ? 0.28 : 0.18, heavy ? 600 : 1800, delay, 0.3); this.tone(heavy ? 300 : 900, 2.4, 'sawtooth', 0.03, heavy ? 120 : 300, delay); },
  whoosh(delay) { this.noise(0.5, 0.15, 2500, delay, 0.6); },
  whistleDown(delay, d = 0.7) { this.tone(1800, d, 'sine', 0.05, 400, delay); },
  scan() { this.tone(1760, 0.08, 'square', 0.07); },
  join() { this.tone(520, 0.08, 'triangle', 0.14, 780); },
  found() { this.tone(660, 0.07, 'triangle', 0.12); this.tone(990, 0.12, 'triangle', 0.12, null, 0.07); },
  out() { this.tone(660, 0.1, 'triangle', 0.14); this.tone(880, 0.1, 'triangle', 0.14, null, 0.08); this.tone(1320, 0.16, 'triangle', 0.12, null, 0.16); },
  coin() { this.tone(1400, 0.06, 'square', 0.06); this.tone(2100, 0.1, 'square', 0.06, null, 0.06); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.14, null, i * 0.11)); },
  jackpot() { for (let i = 0; i < 12; i++) this.tone(800 + i * 120, 0.12, 'square', 0.07, null, i * 0.06); this.fanfare(); },
  bad() { this.tone(160, 0.45, 'sawtooth', 0.18, 90); },
  nope() { this.tone(220, 0.12, 'square', 0.08, 180); },
  chime() { this.tone(659, 0.5, 'sine', 0.12); this.tone(523, 0.7, 'sine', 0.12, null, 0.35); },
  copWhistle() { this.tone(2900, 0.18, 'square', 0.06); this.tone(2900, 0.35, 'square', 0.06, null, 0.25); },
  whistle() { this.tone(2200, 0.35, 'sine', 0.1, 2600); this.tone(2600, 0.3, 'sine', 0.08, 2300, 0.3); },
  boom(delay = 0, k = 1) { this.noise(0.9 * k, Math.min(0.8, 0.5 * k), 120, delay, 0.4); this.tone(90, 0.7 * k, 'sine', Math.min(0.6, 0.35 * k), 30, delay); },
  siren() { for (let i = 0; i < 4; i++) this.tone(600, 0.45, 'sawtooth', 0.07, 1100, i * 0.5); },
  buzzer() { this.tone(110, 0.9, 'square', 0.12); }
};

/* store muzak: soft jazz chords, a walking bass and a few vibraphone notes,
   scheduled a little ahead of time. It speeds up as closing time gets near. */
const M = {
  on: store.get('music', true), timer: null, next: 0, step: 0, gain: null,
  start() {
    if (this.timer || !S.on || !this.on) return;
    const a = S.ensure(); if (!a) return;
    this.gain = a.createGain(); this.gain.gain.value = 0.0001; this.gain.connect(S.master);
    this.gain.gain.exponentialRampToValueAtTime(0.06, a.currentTime + 1.5);
    this.next = a.currentTime + 0.1; this.step = 0;
    this.timer = setInterval(() => this.tick(), 90);
  },
  stop() {
    if (!this.timer) return; clearInterval(this.timer); this.timer = null;
    const a = S.ac, gn = this.gain; if (a && gn) { gn.gain.setTargetAtTime(0.0001, a.currentTime, 0.2); setTimeout(() => gn.disconnect(), 1500); }
  },
  tick() {
    const a = S.ac; if (!a) return;
    const tense = G.state === 'play' && (G.timer < 20 || G.strikes === 2);
    const bpm = tense ? 132 : 96, eighth = 60 / bpm / 2;
    while (this.next < a.currentTime + 0.35) { this.play(this.step, this.next, eighth); this.next += eighth; this.step++; }
  },
  play(step, t, e) {
    const a = S.ac, CH = [[60, 64, 67, 71], [57, 60, 64, 67], [62, 65, 69, 72], [55, 59, 62, 65]];   // Cmaj7 Am7 Dm7 G7
    const bar = Math.floor(step / 8) % 4, s = step % 8, c = CH[bar], hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const note = (m, d, type, vol) => {
      const o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.value = hz(m);
      v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.02); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(v).connect(this.gain); o.start(t); o.stop(t + d + 0.05);
    };
    if (s === 0) c.forEach(m => note(m, e * 7.5, 'triangle', 0.18));
    if (s === 0 || s === 3 || s === 4 || s === 6) note(c[0] - 24 + (s === 4 ? 7 : s === 6 ? 4 : 0), e * 1.6, 'sine', 0.55);
    if ((s === 2 || s === 5 || s === 7) && Math.random() < 0.55) note(pick([72, 74, 76, 79, 81, 84]), e * 3, 'sine', 0.22);
  }
};

  const before = G.timer; G.timer -= dt;

  if (G.quest && G.quest.kind === 'timed') { G.quest.time -= dt; if (G.quest.time <= 0) { pop(p.x, p.y - 70, 'QUEST FAILED', '#ff8080', 22); S.nope(); newQuest(); } }

  for (const s of G.spawns) if (!s.done && G.timer <= s.at) { s.done = true; G.buckos.push(newBucko(s.type, rnd(150, 230), 880, true)); }

  // the line
  p.chain.forEach((b, i) => {
    const t = TYPES[b.type], target = trailPoint((i + 1) * SPACING);
    stepToward(b, target, t.lineSpeed, dt); b.walk += Math.hypot(b.vx, b.vy) * dt * 0.06;
    if (!b.has && inArea(b, AREAS[b.area])) { b.hunt += dt * 2.2; if (b.hunt >= b.need) gotIt(b); }   // you walked him to his aisle
    if (b.type === 'squirrely' && Math.random() < dt * 0.08) {     // got distracted by the birdseed
      p.chain.splice(p.chain.indexOf(b), 1);
      b.state = b.has ? 'wait' : 'shop'; b.cool = 2.5; b.target = freeSpot(); b.pause = 0; b.scanT = 0;
      say(b, 'squirrel', 2); S.tone(300, 0.2, 'triangle', 0.15, 200);
    }
  });

  for (const b of G.buckos) {
    if (b.state === 'leaving') { b.out += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.walk += dt * 9; continue; }
    if (b.state === 'chain') continue;
    b.cool -= dt; b.lure -= dt;
    const T = TYPES[b.type];
    if (b.state === 'entering') { if (stepToward(b, b.target, 90, dt) < 6) { b.state = 'shop'; b.target = null; } b.walk += dt * 7; continue; }
    // waiting customers run out of patience, and then they run
    if (b.state === 'wait' && b.type !== 'contractor' && !b.scanned) {
      b.patience -= dt;
      if (b.patience < 12 && b.chat > 3) { b.chat = rnd(1.5, 3); say(b, 'impatient', 1.8); }
      if (b.patience <= 0) { b.state = 'runner'; b.target = null; say(b, 'run', 2.2); S.tone(500, 0.25, 'sawtooth', 0.06, 300); pop(b.x, b.y - 52, 'RUNNER!', '#ff5050', 20); }
    }
    if (b.state === 'runner') {
      const tgt = runnerTarget(b);
      stepToward(b, tgt, 105, dt); b.walk += dt * 12; pushOut(b, R);
      if (b.y > ZONE_Y && ((b.x > EXIT.x && b.x < EXIT.x + EXIT.w) || (b.x > ENTRANCE.x && b.x < ENTRANCE.x + ENTRANCE.w))) escape(b);
    } else {
      b.chat -= dt;
      if (b.chat <= 0) { b.chat = rnd(7, 16); if (dist(b, p) < 420) say(b, b.state === 'shop' && b.hunt === 0 && Math.random() < 0.6 ? 'lost' : b.type === 'coupon' && Math.random() < 0.5 ? 'coupon' : b.type === 'contractor' && Math.random() < 0.5 ? 'contractor' : 'idle'); }
      if (b.state === 'shop' && inArea(b, AREAS[b.area])) { b.hunt += dt * (b.pause > 0 ? 1.2 : 0.7); if (b.hunt >= b.need) gotIt(b); }
      if (b.lure > 0) { stepToward(b, p, T.speed * 2.6, dt); b.walk += dt * 10; pushOut(b, R); }
      else if (b.pause > 0) { b.pause -= dt; b.vx = b.vy = 0; }
      else {
        if (!b.target) {
          if (b.state === 'shop') b.target = Math.random() < T.find ? freeSpot(AREAS[b.area]) : freeSpot();
          else b.target = { x: rnd(260, 1300), y: rnd(575, 670) };            // done shopping: drift toward the front and wait
        }
        const bx = b.x, by = b.y, sp = b.state === 'wait' ? T.speed * 0.7 : T.speed, d = stepToward(b, b.target, sp, dt); b.walk += dt * 7;
        pushOut(b, R);
        if (Math.hypot(b.x - bx, b.y - by) < sp * dt * 0.3) b.stuck += dt; else b.stuck = 0;
        if (d < 8 || b.stuck > 1) {
          b.target = null; b.stuck = 0;
          b.pause = b.type === 'squirrely' ? rnd(0.1, 0.6) : b.state === 'shop' && inArea(b, AREAS[b.area]) ? rnd(1.5, 3) : rnd(0.6, 3);
        }
      }
    }
    if (b.state === 'leaving') continue;
    if (b.cool <= 0 && dist(b, p) < 40) {
      const wasRunner = b.state === 'runner';
      if (p.chain.length < maxLine()) {
        b.state = 'chain'; b.lure = 0; p.chain.push(b); S.join(); buzz(15);
        if (wasRunner) { say(b, 'caught', 1.8); pop(b.x, b.y - 52, 'CAUGHT!', '#7dff7d', 22); questTick('catch', 1); } else say(b, 'join', 1.6);
      } else if (wasRunner) { b.state = 'wait'; b.patience = 15; b.cool = 1.5; say(b, 'caught', 1.8); pop(b.x, b.y - 52, 'STOPPED', '#7dff7d', 20); questTick('catch', 1); }
      else if (G.clock - G.fullT > 1.5) { G.fullT = G.clock; pop(p.x, p.y - 56, `LINE FULL (${maxLine()})`, '#ffcc00', 18); S.nope(); }
    }
  }

  // police: walk over, yell, leave
  for (const c of G.cops) {
    c.t += dt;
    if (c.phase === 'in') { stepToward(c, { x: p.x + 40, y: p.y + 10 }, 240, dt); c.walk += dt * 11; pushOut(c, R); if (dist(c, p) < 70 || c.t > 4) { c.phase = 'yell'; c.t = 0; c.say = { text: G.strikes <= 1 ? COP_LINES[0] : pick(COP_LINES), t: 0, life: 3.2 }; } }
    else if (c.phase === 'yell') { c.vx = c.vy = 0; c.dir = p.x > c.x ? 1 : -1; if (c.t > 3.4) { c.phase = 'out'; c.t = 0; } }
    else { stepToward(c, { x: EXIT.x + 80, y: 900 }, 200, dt); c.walk += dt * 10; if (c.y > 880) c.gone = true; }
  }
  G.cops = G.cops.filter(c => !c.gone);

  // nobody stands inside anybody
  const live = G.buckos.filter(b => b.state !== 'leaving');
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = R * 1.9;
    if (d < m && d > 0.01) { const k = (m - d) / 2 / d; a.x -= dx * k; a.y -= dy * k; b.x += dx * k; b.y += dy * k; }
  }
  for (const b of live) {
    if (b.state !== 'chain') { const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy); if (d < 34 && d > 0.01) { b.x = p.x + dx / d * 34; b.y = p.y + dy / d * 34; } }

  for (const b of p.chain.slice()) {
    const lane = LANES.findIndex(c => Math.abs(b.x - c) < LANE_W / 2);
    const inLane = lane >= 0 && b.y > CTR_Y - 12 && b.y < CTR_Y + CTR_H + 12;
    if (inLane && !b.scanned && b.type !== 'contractor') {
      b.nag -= dt;
      if (lane === G.closed) { if (b.nag <= 0) { b.nag = 2; pop(b.x, b.y - 52, 'REGISTER CLOSED', '#ffcc00', 17); S.nope(); } }
      else if (!b.has) { if (b.nag <= 0) { b.nag = 2.5; say(b, 'notdone', 2); pop(b.x, b.y - 52, 'NOTHING TO SCAN', '#ffcc00', 17); S.nope(); } }
      else {
        CASHIERS[lane].busy = 0.4;
        const need = 1.6 * (G.perks.scanner ? 0.5 : 1);
        if (b.type === 'coupon') { b.scanT += dt; if (b.scanT >= need) scanned(b); else if (Math.random() < dt * 6) S.tone(1200, 0.03, 'square', 0.04); }
        else scanned(b);
      }
    } else if (!inLane && b.type === 'coupon' && !b.scanned && b.scanT > 0) b.scanT = Math.max(0, b.scanT - dt * 2);
    // a paid Bucko goes OUT, not back into the store
    if (b.scanned && b.y < BACK_IN_Y) {
      b.scanned = false; b.scanT = 0; pop(b.x, b.y - 52, 'RECEIPT VOID', '#ff5050', 20);
      strike(`You took ${b.name} back into the store after he paid. Paid Buckos go OUT.`);
    }
    if (b.y > ZONE_Y && b.x > EXIT.x && b.x < EXIT.x + EXIT.w) leave(b, 'exit');
    else if (b.y > ZONE_Y && b.x > ENTRANCE.x && b.x < ENTRANCE.x + ENTRANCE.w) leave(b, 'entrance');
    else if (b.x > 1465 && b.y > GATE.y && b.y < GATE.y + GATE.h) leave(b, 'gate');
  }
  G.buckos = G.buckos.filter(b => !(b.state === 'leaving' && b.out > 1.2));
  if (G.state !== 'play' || G.as) return;

  const inside = G.buckos.filter(b => b.state !== 'leaving').length, pending = G.spawns.some(s => !s.done);
  if (!inside && !pending) endDay(false);
  else if (G.timer <= 0) endDay(true);
}

function scanned(b) {
  b.scanned = true; S.scan();
  if (b.type === 'coupon') b.price *= 0.89;
  pop(b.x, b.y - 52, (b.type === 'coupon' ? 'COUPONS! ' : '') + money2(b.price), '#7dff7d', 20);
}
function escape(b) {
  b.state = 'leaving'; b.out = 0; b.vx = 0; b.vy = 120;
  pop(b.x, b.y - 52, 'ESCAPED!', '#ff4d4d', 28);
  strike(`${b.name} escaped without paying for his Bucko Goods (${b.item}).`);
}
function leave(b, door) {

  b.state = 'leaving'; b.out = 0;
  if (door === 'gate') { b.vx = 120; b.vy = 0; } else { b.vx = 0; b.vy = 110; }
  let bad = null;
  if (door === 'entrance') bad = `You took ${b.name} out through the ENTRANCE. That's an IN door.`;
  else if (!b.has) bad = `${b.name} never found his ${b.item}. You removed him before he was done shopping.`;
  else if (door === 'gate' && b.type !== 'contractor') bad = `${b.name} isn't a contractor. Customers don't leave through the Lumber Yard.`;
  else if (door === 'exit' && b.type === 'contractor') bad = `${b.name} is a CONTRACTOR. Contractors leave through the Lumber Yard gate.`;
  else if (door === 'exit' && !b.scanned) bad = `UNPAID EXIT! ${b.name} walked out with Bucko Goods he never paid for.`;
  G.removed++; G.dayRemoved++;
  if (bad) { pop(b.x, b.y - 52, 'WRONG!', '#ff4d4d', 30); b.say = { text: 'Uh oh...', t: 0, life: 1.2 }; strike(bad); return; }
  G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
  G.trip = G.clock - G.lastOut < 2.5 ? G.trip + 1 : 1; G.lastOut = G.clock;
  const mult = 1 + 0.25 * Math.min(G.streak - 1, 8);

  if (G.trip > 1) v += 15 * (G.trip - 1);
  earn(v); S.out(); S.coin(); say(b, 'thanks', 1.2);
  pop(b.x, b.y - 52, '+' + money(v) + (mult > 1 ? `  x${mult.toFixed(2).replace(/\.?0+$/, '')}` : '') + (G.trip > 1 ? `  TRIP x${G.trip}` : ''), '#ffe14d', 22);
  for (let i = 0; i < 10; i++) G.parts.push({ x: b.x, y: b.y - 20, vx: rnd(-120, 120), vy: rnd(-220, -60), life: 0.7, t: 0, c: pick(['#ffe14d', '#7dff7d', '#fff']), s: 4, kind: 'spark' });
  // the lucky ones: a big spender now and then, and once in a blue moon a jackpot
  const r = Math.random();
  if (r < 1 / 400) {
    earn(10000); S.jackpot(); buzz([60, 40, 60, 40, 200]); confetti(b.x, b.y - 30, 120);
    G.toast = { head: 'JACKPOT!', body: `${b.name} found $10,000 in his truck and spent every cent at Buckards.`, fine: 0, t: 0, life: 4.5, n: 0, good: true };
  } else if (r < 0.05) {
    const big = Math.round(rnd(800, 2500)); earn(big); S.fanfare(); confetti(b.x, b.y - 30, 50);
    pop(b.x, b.y - 80, `BIG SPENDER! +${money(big)}`, '#7dff7d', 26);
    say(b, 'thanks'); b.say.text = pick(['Throw in a riding mower', 'Gimme the big grill too', 'Add a hot tub, why not']);
  }
  questTick('out', 1); questTick('timed', 1); questTick('trip', G.trip); questTick('streak', G.streak);
  if (b.type === 'coupon') questTick('coupon', 1);
  if (b.type === 'contractor') questTick('contractor', 1);
}
function endDay(closing) {
  const left = G.buckos.filter(b => b.state !== 'leaving');
  S.buzzer();
  if (closing && left.length) {
    G.buckos = G.buckos.filter(b => b.state === 'leaving'); G.player.chain = [];
    strike(`${left.length} Bucko${left.length > 1 ? 's were' : ' was'} still in the store at closing time.`);
    if (G.as) return;
  }
  const bonus = closing ? 0 : Math.round(G.timer) * 5;
  if (bonus) earn(bonus);
  G.summary = { left: closing ? left.length : 0, bonus };
  G.state = 'summary';
}

/* what to do next, for the arrow and the hint line */
function objective() {
  const p = G.player, line = p.chain;
  const runner = G.buckos.find(b => b.state === 'runner');
  if (runner && line.length < maxLine()) return { pt: runner, warn: true, text: `${runner.name} is making a run for it! Catch him before he reaches a door.` };
  if (!line.length) {
    let best = null, bd = 1e9;
    for (const b of G.buckos) if ((b.state === 'wait' || b.state === 'shop') && b.cool <= 0) { const d = dist(b, p) + (b.has ? -b.patience * 3 : 600); if (d < bd) { bd = d; best = b; } }
    return best ? { pt: best, text: best.has ? `${best.name} is done shopping. Walk into him.` : 'Buckos are still shopping. Walk into one to help him find his stuff.' } : null;
  }
  const lost = line.find(b => !b.has);
  if (lost) { const a = AREAS[lost.area]; return { pt: { x: a.cx, y: clamp(p.y, a.y + 30, a.y + a.h - 30) }, text: `${lost.name} needs a ${lost.item}. Take him to ${lost.area}.` }; }
  const unpaid = line.filter(b => b.type !== 'contractor' && !b.scanned), con = line.filter(b => b.type === 'contractor'), reg = line.filter(b => b.type !== 'contractor');
  if (unpaid.length) {
    const open = LANES.filter((_, i) => i !== G.closed), c = open.reduce((a, l) => Math.abs(l - p.x) < Math.abs(a - p.x) ? l : a);
    return { pt: { x: c, y: CTR_Y + 20 }, text: unpaid.some(b => b.type === 'coupon') ? 'Checkout! Hold coupon Buckos in the lane until the ring fills.' : 'Take them through an open register.' };
  }
  if (con.length && reg.length) return { pt: null, warn: true, text: 'Mixed line! LET GO of the contractors or the customers - they use different doors.' };
  if (con.length) return { pt: { x: 1520, y: GATE.y + GATE.h / 2 }, text: 'Contractors: out the LUMBER YARD gate (top right).' };

/* ------------------------------------------------------------ airstrikes */
const PATH0 = { x: -500, y: 830 }, PATH1 = { x: 2100, y: 60 };
const PDIR = (() => { const dx = PATH1.x - PATH0.x, dy = PATH1.y - PATH0.y, d = Math.hypot(dx, dy); return { x: dx / d, y: dy / d, len: d }; })();
const RUN_START = 0.9;
const PLANE_SCALE = { 'A-10': 1.05, 'F-15': 1.1, 'F-16': 1.0, 'F/A-18': 1.05, 'B-1': 1.5, 'B-21': 1.5, 'B-52': 1.7 };
function planeAt(t) { const k = (t - RUN_START) / G.as.run; return { x: PATH0.x + (PATH1.x - PATH0.x) * k, y: PATH0.y + (PATH1.y - PATH0.y) * k }; }
const timeOver = p => RUN_START + ((p.x - PATH0.x) * PDIR.x + (p.y - PATH0.y) * PDIR.y) / PDIR.len * G.as.run;   // when the plane passes a point

function beginAirstrike() {
  const L = threat(), heavy = L.ac.startsWith('B');
  const as = G.as = { t: 0, L, run: heavy ? 3.4 : 2.3, ev: [], proj: [], end: 6, nuke: null };
  G.state = 'airstrike'; M.stop(); S.siren(); S.jet(0.6, heavy); buzz([200, 100, 200]);
  for (const b of G.buckos) if (Math.random() < 0.5) say(b, 'ope', 2.5);
  const p = G.player, spots = n => { const a = [{ x: p.x, y: p.y }]; while (a.length < n) a.push({ x: rnd(120, 1480), y: rnd(130, 840) }); return a; };
  if (L.fx === 'gun') { S.brrt(1.9, RUN_START + 0.55); as.end = 5.6; }
  else if (L.fx === 'missile') {
    spots(L.n).forEach((s, i) => as.ev.push({ at: RUN_START + 0.35 + i * 0.25, kind: 'missile', x: s.x, y: s.y, r: 110 * L.big })); as.end = RUN_START + 0.35 + L.n * 0.25 + 3.4;
  } else if (L.fx === 'bomb') {
    spots(L.n).forEach(s => as.ev.push({ at: Math.max(RUN_START + 0.2, timeOver(s) - 0.35), kind: 'bomb', x: s.x, y: s.y, r: 120 * L.big, fall: 0.7 })); as.end = 6;
  } else if (L.fx === 'cluster') {
    as.ev.push({ at: Math.max(RUN_START + 0.2, timeOver(p) - 0.4), kind: 'cluster', x: p.x, y: p.y, r: 45, fall: 0.6, n: L.n }); as.end = 6;
  } else if (L.fx === 'carpet') {
    for (let i = 0; i < L.n; i++) {     // a band of bombs walked along the plane's track across the whole store
      const k = i / (L.n - 1), base = { x: PATH0.x + (PATH1.x - PATH0.x) * (0.22 + k * 0.56), y: PATH0.y + (PATH1.y - PATH0.y) * (0.22 + k * 0.56) };
      const s = { x: clamp(base.x - PDIR.y * rnd(-260, 260), 60, 1540), y: clamp(base.y + PDIR.x * rnd(-260, 260), 120, 860) };
      as.ev.push({ at: timeOver(s) - 0.3, kind: 'bomb', x: s.x, y: s.y, r: 95 * L.big, fall: 0.7 });
    }
    as.ev.push({ at: timeOver(p) - 0.3, kind: 'bomb', x: p.x, y: p.y, r: 100 * L.big, fall: 0.7 });
    as.end = 7;
  } else if (L.fx === 'mop') {
    as.ev.push({ at: Math.max(RUN_START + 0.2, timeOver(p) - 0.6), kind: 'bomb', x: p.x, y: p.y, r: 420, fall: 1.2, huge: true }); as.end = 7;
  } else if (L.fx === 'nuke') {
    as.ev.push({ at: timeOver({ x: 800, y: 470 }) - 0.2, kind: 'nukebomb', x: 800, y: 470, fall: 2.4 }); as.end = 11;
  }
}
function explode(x, y, r, quiet) {
  burst(x, y, clamp(r / 70, 0.6, 5));
  G.decals.push({ x, y, r: r * 0.42 }); if (G.decals.length > 900) G.decals.shift();
  if (r > 60) G.fires.push({ x, y, k: clamp(r / 110, 0.5, 3) });
  G.shake = Math.max(G.shake, Math.min(42, r / 5));
  if (!quiet) S.boom(0, clamp(r / 120, 0.6, 2.2));
  for (const e of [G.player, ...G.buckos, ...G.cops]) if (!e.rag && Math.hypot(e.x - x, e.y - y) < r) {
    ragdoll(e, r / 120); if (e.state === 'chain') e.state = 'shop';
    if (e === G.player) { G.slow = 0.7; buzz(300); }
  }
}
function updateAirstrike(dt) {
  const as = G.as; as.t += dt; const t = as.t, p = G.player, L = as.L;
  if (L.fx === 'gun' && t > RUN_START + 0.15 && t < RUN_START + 1.7) {
    const pl = planeAt(t), n = Math.max(1, Math.round(dt * 70));
    for (let i = 0; i < n; i++) {
      const lead = rnd(260, 420), s = rnd(-55, 55);
      const ix = pl.x + PDIR.x * lead - PDIR.y * s, iy = pl.y + PDIR.y * lead + PDIR.x * s;
      if (ix < 0 || ix > W || iy < 60 || iy > H) continue;
      impact(ix, iy);

  }
  if (L.fx === 'gun' && t > RUN_START + 0.4 && t < RUN_START + 1.8 && !as.hitPlayer) {
    const pl = planeAt(t), along = (p.x - pl.x) * PDIR.x + (p.y - pl.y) * PDIR.y;
    if (along < 340) { as.hitPlayer = true; G.decals.push({ x: p.x, y: p.y, r: 40 }); burst(p.x, p.y, 1.6); ragdoll(p, 1); S.boom(0.4); G.shake = 26; G.slow = 0.8; buzz(400); }
  }
  // release scheduled weapons
  for (const e of as.ev) if (!e.done && t >= e.at) {
    e.done = true; const pl = planeAt(t);
    if (e.kind === 'missile') { as.proj.push({ kind: 'missile', sx: pl.x, sy: pl.y, x: pl.x, y: pl.y, tx: e.x, ty: e.y, t: 0, dur: 0.55, r: e.r }); S.whoosh(0); }

    if (q.kind === 'missile' && Math.random() < 0.9) G.parts.push({ x: q.x, y: q.y, vx: rnd(-10, 10), vy: rnd(-10, 10), life: 0.8, t: 0, c: '#d8d4cc', s: rnd(5, 9), kind: 'smoke' });

  else if (id === 'map') { g.fillStyle = '#2e86de'; rr(-14, -24, 28, 48, 5); g.fill(); g.stroke(); g.fillStyle = '#e8813a'; for (let k = 0; k < 3; k++) g.fillRect(-9 + k * 7, -16, 4, 26); g.fillStyle = '#ffe14d'; g.beginPath(); g.arc(4, 14, 3, 0, 7); g.fill(); }
  else { g.fillStyle = '#3c8a3c'; g.beginPath(); g.arc(0, 6, 18, 0, 7); g.fill(); g.stroke(); g.fillRect(-6, -18, 12, 8); text('$', 0, 8, 20, '#ffe14d'); }
  g.restore();
}
function drawPause() {
  paper(560, 250, 480, 440);
  text('ON BREAK', 800, 305, 40, '#0a7a36');
  text(`Total score ${money(G.total)} · Next threat: ${threat().ac}`, 800, 345, 15, '#555', 'center', '700', null, FB);
  button(620, 370, 360, 64, 'BACK TO WORK', resume, { size: 24 });
  button(620, 450, 360, 56, 'MUSIC: ' + (M.on ? 'ON' : 'OFF'), toggleMusic, { size: 20, bg: '#2c5f8a', bg2: '#3b7bb3' });
  button(620, 522, 360, 56, 'SOUND: ' + (S.on ? 'ON' : 'OFF'), toggleSound, { size: 20, bg: '#2c5f8a', bg2: '#3b7bb3' });
  button(620, 594, 360, 56, 'QUIT SHIFT', () => { G.state = 'title'; M.stop(); }, { size: 20, bg: '#8a1a1a', bg2: '#c0392b' });
}
function drawAirstrikeText() {
  const as = G.as, t = as.t, L = as.L;
  if (t < RUN_START + 0.4) {
    text(`⚠  ${L.ac} INBOUND  ⚠`, 800, 400, 64, '#fff', 'center', '900', '#600');
    text(L.w.toUpperCase(), 800, 466, 30, '#ffe14d', 'center', '900', '#600');
    text('The Federal Bureau of Bucko Affairs has authorized a correction.', 800, 512, 22, '#fff', 'center', '800', '#600', FB);
  }
  if (L.fx === 'gun' && t > RUN_START + 0.6 && t < RUN_START + 2.8) {
    const k = clamp((t - RUN_START - 0.6) * 3, 0, 1);
    g.save(); g.translate(800, 300); g.rotate(-0.08); 
    text('BRRRRRRRRRRT', 0, 0, 96 * k + 1, '#fff', 'center', '900', '#7a1a00'); g.restore();
  }
}
function drawAirstrikeFX() {
  const as = G.as, t = as.t, pl = planeAt(t), ac = as.L.ac, s = PLANE_SCALE[ac];
  // falling things first (under the plane)
  for (const q of as.proj) if (!q.done) {
    if (q.kind === 'missile') {
      const a = Math.atan2(q.ty - q.sy, q.tx - q.sx);
      g.save(); g.translate(q.x, q.y); g.rotate(a); g.fillStyle = '#eee'; g.fillRect(-14, -3, 28, 6); g.fillStyle = '#c0392b'; g.fillRect(10, -3, 5, 6);
      g.fillStyle = '#ffcf5a'; g.beginPath(); g.moveTo(-14, -3); g.lineTo(-34, 0); g.lineTo(-14, 3); g.fill(); g.restore();
    } else {
      const k = q.t / q.dur, sz = (q.kind === 'nukebomb' ? 2.2 : q.huge ? 1.8 : 1) * (1.6 - k * 0.7);
      g.fillStyle = `rgba(0,0,0,${0.15 + 0.35 * k})`; g.beginPath(); g.ellipse(q.tx, q.ty, 10 * sz * (0.5 + k), 5 * sz * (0.5 + k), 0, 0, 7); g.fill();
      g.save(); g.translate(q.x, q.y - (1 - k) * 60); g.scale(sz, sz);
      if (q.kind === 'nukebomb') { g.strokeStyle = '#ddd'; g.lineWidth = 1; g.beginPath(); g.moveTo(-14, -26); g.lineTo(0, -6); g.lineTo(14, -26); g.stroke(); g.fillStyle = '#e8e8e8'; g.beginPath(); g.arc(0, -30, 18, Math.PI, 0); g.fill(); }
      g.fillStyle = q.kind === 'nukebomb' ? '#e8e2c0' : '#3d4a3a'; rr(-6, -12, 12, 24, 6); g.fill(); g.fillStyle = '#222'; g.fillRect(-7, 8, 14, 3);
      if (q.kind === 'nukebomb') { g.fillStyle = '#e8c21e'; g.beginPath(); g.arc(0, 0, 4, 0, 7); g.fill(); }
      g.restore();
    }
  }
  if (t > RUN_START - 0.1 && t < RUN_START + as.run + 0.3) {
    const ang = Math.atan2(PDIR.y, PDIR.x);
    g.save(); g.globalAlpha = 0.28; g.fillStyle = '#000'; g.translate(110, 150); drawJet(ac, pl.x, pl.y, ang, s, true); g.restore();
    drawJet(ac, pl.x, pl.y, ang, s);
    if (as.L.fx === 'gun' && t > RUN_START + 0.15 && t < RUN_START + 1.7) {
      const nx = pl.x + PDIR.x * 140, ny = pl.y + PDIR.y * 140;
      g.fillStyle = '#ffcf5a'; g.beginPath(); g.arc(nx, ny, 12, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,220,120,0.7)'; g.lineWidth = 2;
      for (let k = 0; k < 4; k++) { const l = rnd(150, 400); g.beginPath(); g.moveTo(nx, ny); g.lineTo(nx + PDIR.x * l + rnd(-20, 20), ny + PDIR.y * l + rnd(-20, 20)); g.stroke(); }
    }
  }
  // the nuke: fireball, shockwave, then the cloud
  if (as.nuke) {
    const n = as.nuke, R2 = Math.min(1100, n.t * 700);
    const fb = g.createRadialGradient(n.x, n.y, 0, n.x, n.y, R2);
    fb.addColorStop(0, `rgba(255,255,240,${clamp(1.4 - n.t * 0.3, 0, 1)})`); fb.addColorStop(0.4, `rgba(255,190,60,${clamp(1.1 - n.t * 0.25, 0, 0.95)})`); fb.addColorStop(1, 'rgba(160,40,0,0)');
    g.fillStyle = fb; g.beginPath(); g.arc(n.x, n.y, R2, 0, 7); g.fill();
    const ring = n.t * 1300; g.strokeStyle = `rgba(255,255,255,${clamp(0.8 - n.t * 0.25, 0, 0.8)})`; g.lineWidth = 18; g.beginPath(); g.arc(n.x, n.y, ring, 0, 7); g.stroke();
    // the ground underneath: scorched
    const sk = clamp(n.t / 1.5, 0, 1), scorch = g.createRadialGradient(n.x, n.y, 30, n.x, n.y, 950);
    scorch.addColorStop(0, `rgba(25,15,8,${0.92 * sk})`); scorch.addColorStop(0.55, `rgba(60,35,20,${0.7 * sk})`); scorch.addColorStop(1, 'rgba(60,35,20,0)');
    g.fillStyle = scorch; g.fillRect(0, 0, W, H);
    if (n.t > 0.8) {     // the mushroom cloud seen from above: a churning cap rolling outward with a hot core
      const k = clamp((n.t - 0.8) / 2.5, 0, 1), cap = 140 + 300 * k;
      for (let ring = 0; ring < 3; ring++) for (let i = 0; i < 22; i++) {
        const a = i / 22 * Math.PI * 2 + n.t * (0.25 - ring * 0.08) + ring, rad = cap * (1 - ring * 0.32);
        const tone = 150 + ((i * 37 + ring * 11) % 60) - ring * 30;
        g.fillStyle = `rgba(${tone + 40},${tone},${tone - 30},${0.9 * k})`;
        g.beginPath(); g.arc(n.x + Math.cos(a) * rad, n.y + Math.sin(a) * rad * 0.75, (70 + 60 * k) * (1 - ring * 0.2), 0, 7); g.fill();
      }
      const core = g.createRadialGradient(n.x, n.y, 10, n.x, n.y, cap * 0.7);
      core.addColorStop(0, `rgba(255,240,180,${0.95 * k})`); core.addColorStop(0.4, `rgba(255,140,40,${0.85 * k})`); core.addColorStop(1, 'rgba(150,60,20,0)');
      g.fillStyle = core; g.beginPath(); g.arc(n.x, n.y, cap * 0.7, 0, 7); g.fill();
    }
  }
}
/* the next morning's paper. kind: 'aftermath' (store reopens) or 'nuke' (game over) */
function drawNewspaper(kind) {
  const as = G.as, t = as.t, a = clamp((t - as.end) / 1.0, 0, 1); if (a <= 0) return;
  const L = as.L, nuke = kind === 'nuke';
  g.globalAlpha = a;
  const x = 330, y = 140, w = 940, h = 640;
  g.save(); g.translate(800, 470); g.rotate(-0.02 + (1 - a) * 0.3); g.scale(0.6 + 0.4 * a, 0.6 + 0.4 * a); g.translate(-800, -470);
  g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(x + 12, y + 16, w, h);
  g.fillStyle = '#efe9da'; g.fillRect(x, y, w, h);
  text('THE BUCKARDS COUNTY GAZETTE', 800, y + 48, 38, '#1b1b1b', 'center', '900', null, FN);
  g.fillStyle = '#1b1b1b'; g.fillRect(x + 30, y + 76, w - 60, 3); g.fillRect(x + 30, y + 104, w - 60, 1.5);
  text(`DAY ${G.day} EDITION · FINAL · 50¢`, 800, y + 91, 14, '#333', 'center', '700', null, FB);
  const head = nuke ? 'BUCKARDS NUKED' : `${L.ac} HITS LOCAL BUCKARDS`;
  text(head, 800, y + 150, head.length > 22 ? 44 : 54, nuke ? '#8a1a1a' : '#111', 'center', '900', null, FN);
  text(nuke ? 'B-52 drops B61 on home improvement store; manager\'s total score "completely gone"'
    : `${L.w} used after third Bucko violation; manager fined ${money(as.fine || L.fine)}`, 800, y + 194, 19, '#333', 'center', '700', null, FN);
  const px = x + 40, py = y + 222, pw = 470, ph = 280;
  g.fillStyle = '#777'; g.fillRect(px, py, pw, ph);
  if (G.snap) { g.save(); try { g.filter = 'grayscale(1) contrast(1.2)'; } catch (e) {} g.drawImage(G.snap, px, py, pw, ph); g.restore(); }
  g.strokeStyle = '#222'; g.lineWidth = 2; g.strokeRect(px, py, pw, ph);
  text(nuke ? 'What\'s left of Buckards, Tuesday.' : 'Smoke rises over Buckards on Tuesday.', px, py + ph + 18, 13, '#444', 'left', '700', null, FB);
  const next = LADDER[Math.min(G.level + 1, LADDER.length - 1)];
  const tx = px + pw + 30, lines = nuke ? [
    'Federal officials say this was', '"the last resort." Again.', '',
    `Days survived: ${G.day}`, `Buckos removed: ${G.removed}`, `Total score lost: ${money(as.lost || 0)}`, `Total score now: $0`, '',
    `Best ever (kept): ${money(G.best)}`]
    : ['Officials confirmed the strike', `after repeated Bucko violations.`, '',
    `Fine: -${money(as.fine || L.fine)}`, `Wallet now: ${money(G.cash)}`, `Total score: ${money(G.total)}`, `Best: ${money(G.best)}`, '',
    `NEXT TIME: ${next.ac}`, next.w];
  lines.forEach((l, i) => text(l, tx, py + 14 + i * 26, i >= 3 && i <= 6 ? 19 : 17, (!nuke && i >= 8) || (nuke && i === 5) ? '#8a1a1a' : '#222', 'left', i >= 3 ? '900' : '700', null, FN));
  g.restore();
  if (t > as.end + 2) {
    if (nuke) button(620, 810, 360, 62, 'START OVER', () => { G.state = 'title'; }, { size: 24, bg: '#8a1a1a', bg2: '#c0392b' });
    else button(560, 810, 480, 62, 'REBUILD & REOPEN →', reopen, { size: 24 });
  }
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------ frame */
let last = performance.now();
function frame(now) {
  let dt = clamp((now - last) / 1000, 0, 0.05) * (G.timeScale ?? 1); last = now;   // rAF time can be a hair before the script started
  if (G.slow > 0) { G.slow -= dt; dt *= 0.3; }
  update(dt);
  HITS = [];
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#06331a'; g.fillRect(0, 0, cw, ch);
  const sh = G.shake ? { x: rnd(-G.shake, G.shake), y: rnd(-G.shake, G.shake) } : { x: 0, y: 0 };
  const menuLayer = () => g.setTransform(dpr * ov, 0, 0, dpr * ov, dpr * (cw / 2 - 800 * ov), dpr * (ch / 2 - 490 * ov));
  if (G.state === 'title') {
    g.fillStyle = '#3c3f43'; g.fillRect(0, 0, cw, ch);
    g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy); drawTitle(G.clock += dt);
  } else {
    if (!staticLayer) buildStatic();
    updateCam(dt);
    g.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * (cam.tx + sh.x), dpr * (cam.ty + sh.y));
    g.drawImage(staticLayer, 0, 0, W, H);
    for (const d of G.decals) { g.fillStyle = 'rgba(30,25,20,0.55)'; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill(); }
    drawArrow();
    const people = [...G.buckos, G.player, ...CASHIERS, ...G.cops];
    if (G.strikes >= 2 && !isAir()) people.push(...AGENTS);
    people.sort((a, b) => a.y - b.y);
    for (const e of people) {
      if (e === G.player) { if (!(G.as && G.as.hitPlayer && !e.rag)) drawPerson(e, PLAYER_LOOK, { r: 19 }); }
      else if (e.isCashier) drawCashier(e);
      else if (e.isAgent) { e.dir = G.player.x > e.x ? 1 : -1; drawPerson(e, AGENT_LOOK); }
      else if (G.cops.includes(e)) drawPerson(e, COP_LOOK, { r: 19, angry: true });
      else drawBucko(e);
    }
    drawParts();
    drawCeiling();
    for (const b of G.buckos) drawWant(b);
    for (const b of G.buckos) drawBubble(b);
    for (const c of G.cops) drawBubble(c, true);
    for (const p of G.pops) { const k = p.t / 1.4; g.globalAlpha = 1 - k * k; text(p.text, p.x, p.y - k * 40, p.size, p.color, 'center', '900', 'rgba(0,0,0,0.75)'); }
    g.globalAlpha = 1;
    const air = isAir();
    if (air) drawAirstrikeFX();
    if (air && G.as.t > G.as.end - 1 && !G.snap) {        // the newspaper photo
      const c = document.createElement('canvas'); c.width = 470; c.height = 280;
      const s = Math.min(cv.width / 470, cv.height / 280);
      c.getContext('2d').drawImage(cv, (cv.width - 470 * s) / 2, (cv.height - 280 * s) / 2, 470 * s, 280 * s, 0, 0, 470, 280); G.snap = c;
    }
    // screen-space layers from here down
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!vignette) { vignette = g.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.35, cw / 2, ch / 2, Math.max(cw, ch) * 0.75); vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.35)'); }
    g.fillStyle = vignette; g.fillRect(0, 0, cw, ch);
    if (G.state === 'play' && G.timer < 12) {                // the lights going down at closing
      const k = 1 - G.timer / 12;          // lights go down smoothly, no flicker
      g.fillStyle = `rgba(0,0,20,${k * 0.3})`; g.fillRect(0, 0, cw, ch);
    }
    if (air && G.as.t < RUN_START + 0.4) { g.fillStyle = `rgba(200,0,0,${0.25 * clamp(G.as.t * 2, 0, 1)})`; g.fillRect(0, 0, cw, ch); }
    if (air && G.as.nuke && G.as.nuke.t < 3) { const n = G.as.nuke.t; g.fillStyle = `rgba(255,250,235,${0.55 * clamp(n < 0.4 ? n / 0.4 : 1 - (n - 0.4) / 2.6, 0, 1)})`; g.fillRect(0, 0, cw, ch); }   // one slow glow, never a flash
    if (G.flash) { g.fillStyle = `rgba(255,248,230,${Math.min(1, G.flash * 0.7)})`; g.fillRect(0, 0, cw, ch); }
    g.setTransform(dpr * hs, 0, 0, dpr * hs, dpr * hx, 0);
    g.fillStyle = '#076b2f'; g.fillRect(-hx / hs - 10, 0, cw / hs + 20, 60);
    drawHUD();
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cam.s > scFit * 1.08 && G.state === 'play') drawMinimap();
    const ts = Math.min(cw / 900, ch / 500, 1);
    g.setTransform(dpr * ts, 0, 0, dpr * ts, dpr * (cw / 2 - 800 * ts), dpr * (hudH + 4 - 75 * ts)); drawToast(); drawPA();
    g.setTransform(dpr * ts, 0, 0, dpr * ts, dpr * (cw / 2 - 800 * ts), dpr * (ch - 46 * ts)); drawHint();
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (['intro', 'summary', 'shop', 'pause'].includes(G.state)) { g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 0, cw, ch); }
    if (G.state === 'gameover' || G.state === 'aftermath') { g.fillStyle = `rgba(10,8,6,${0.82 * clamp((G.as.t - G.as.end) / 1.0, 0, 1)})`; g.fillRect(0, 0, cw, ch); }
    menuLayer();
    if (G.state === 'airstrike') drawAirstrikeText();
    if (G.state === 'intro') drawIntro();
    else if (G.state === 'summary') drawSummary();
    else if (G.state === 'shop') drawShop();
    else if (G.state === 'pause') drawPause();
    else if (G.state === 'aftermath') drawNewspaper('aftermath');
    else if (G.state === 'gameover') { drawNewspaper('nuke'); if (G.as.t > G.as.end + 2) drawUpdateBanner(800, 100); }
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawControls();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* updates: the Android wrapper calls grUpdate when it has one; on the PC the
   launcher does the updating and the page only says that a new version is out */
window.grUpdate = (state, version, notes) => { G.update = { state, version, notes }; };
if (!APP && /^(file|https?):$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.host)) {
  fetch(UPDATE_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
    .then(m => { if (m && newer(m.version, GR_VERSION)) G.update = { state: 'pc', version: m.version, notes: m.notes }; }).catch(() => {});
}
</script>
